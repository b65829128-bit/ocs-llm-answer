[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocs-llm-answerer"
version = "0.3.1"
description = "Local LLM-backed answerer for OCS (AnswererWrapper protocol)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
ocs-llm-answerer = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.uv-cache",
    "/.uv-python",
    "/.env",
    "/.pytest_cache",
    "/dist",
    "/data",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
